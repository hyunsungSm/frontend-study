<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    *{
      box-sizing: border-box;
    }

    .login-background{
      width: 100%;
      background-color: white;
      padding: 100px 0;
    }

    .login-container{
      width: 60%;
      height: 400px;
      max-width: 700px;
      padding: 5px 10px 5px 10px;
      background-color: white;
      border: 2px solid gray;
      border-radius: 10px;
      margin: 0 auto;
    }

    .id-box{
      width: 80%;
      height: 60px;
      background-color: white;
      border: 2px solid gray;
      border-radius: 8px 8px 0 0;
      margin: 0 auto;
      margin-top: 10%;
      padding: 1px 10px 0 20px;
      color: gray;
      position: relative;
    }

    p{
      position: absolute;
      z-index: 1;
    }

    input{
      width: 80%;
      border: none;
      border-radius: 0;
      cursor: pointer;
      display: block;
      position: absolute;
      bottom: 10%;
    }
    
    p{
      margin-bottom: 0;
    }

    .pw-box{
      width: 80%;
      height: 59px;
      background-color: white;
      border: 2px solid gray;  
      border-radius: 0 0 8px 8px;
      margin: 0 auto;
      margin-bottom: 40px;
      padding: 0 10px 5px 20px;
      color: gray;
      position: relative;
    }

    button{
      width: 80%;
      padding: 15px;
      display: flex;
      margin: 0 auto;
      flex-direction: column-reverse;
      cursor: pointer;
    }

    .btn1{
      margin-bottom: 10px;
      background-color: lightgreen;
      border-radius: 10px;
      border: 2px solid green;
      font-weight: bold;
      font-size: 15px;
    }

    .btn2{
      background-color: white;
      border-radius: 10px;
      border: 2px solid green;
      font-weight: bold;
      font-size: 15px;
      color: green;
    }

  </style>
</head>
<body>
  <div class="login-background">
    <div class="login-container">
      <div class="id-box">
        <p class="p-up">
          <label for="id">아이디 또는 전화번호</label>
        </p>
        <input type="text" name="id">
      </div>
      <div class="pw-box">
        <p>
          <label for="pw">비밀번호</label>
        </p>
        <input type="text" name="pw">
      </div>

      <button type="button" class="btn1">로그인</button>
      <button type="button" class="btn2">회원가입</button>
    </div>
  </div>
</body>
</html>
