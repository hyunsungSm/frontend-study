<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .navbar{
      height: 30px;
      display: flex;
      column-gap: 10px;
    }
    .navbar li{
      list-style: none;
      width: 60px;
      background-color: #ddd;
      text-align: center;
      border-radius: 5px;
    }
    .container{
      display: flex;
      width: 800px;
      margin-top: 30px;
      margin-left: 100px;
      justify-content: center;
    }
    .blog-list-item{
      display: flex;
    }
    .blog-content{
      width: 80%;
    }
    .blog-img{
      width: 20%;
    }
    .content-header{
      display: flex;
      align-items: center;
    }
    .content-header img{
      width: 70px;
      border-radius: 35px;
      display: flex;
    }
    .name h4,
    .name p{
      margin: 5px;
    }
    .blog-img > img{
      width: 100%;
      height: 100%;
      /* 이미지 원본 비율을 유지하고 싶다면 */
      object-fit: cover;
    }
  </style>
</head>
<body>
  <!-- Tip! 레이아웃 만드는 기본 
    뭘 만들든 레이아웃은 항상 수평(행)으로 자른 후 박스부터 만들고 시작하면 됨
    그리고 이 박스들을 전부 <div>로 구현해 놓으면 됨(물론 시맨틱 태그도 최대한 활용)
    그리고 박스 안에 글 넣고 그림 넣고 하면 끝!

    이 때 <div>는 블록 요소이기 때문에 위아래로 배치
    좌우로 나란히 배치하고 싶으면 float(😢), inline-block(😐), Flexbox(😁)
  -->
  <!-- 이모지 단축키: 윈도우키 + 마침표😊 -->

  <!-- navbar -->
  <nav>
    <ul class="navbar">
      <li>영화</li>
      <li>맛집</li>
      <li>IT</li>
      <li>컴퓨터</li>
    </ul>
  </nav>

  <!-- blog list -->
  <div class="container">
    <!-- blog list item: 게시글 하나 -->
    <div class="blog-list-item">
      <div class="blog-content">
        <div class="content-header">
          <!-- 프로필 이미지 -->
          <img src="/05_CSS/images/img_avatar.png">
          <!-- 작성자, 시간 -->
          <div class="name">
            <h4>오현성</h4>
            <p>1시간 전</p>
          </div>
        </div>
        <div class="contenet-body">
          <!-- 글 제목, 글 내용 -->
          <h3>가성비 맛집을 발견했어요!</h3>
          <p>소고기 맛있어.초밥 맛있어.치킨 맛있어.돼지고기 맛있어.쌀국수 맛있어.돈까스 맛있어.닭갈비 맛있어.한우한우한우한우한우한우한우한우한우</p>
        </div>
      </div>
      <div class="blog-img">
        <!-- 샘플 이미지 -->
        <img src="https://www.bing.com/th/id/OIP.Pe_Z6VhTQorpljuzCq6HwgHaE5?w=268&h=211&c=8&rs=1&qlt=90&o=6&pid=3.1&rm=2" alt="이미지">
      </div>
    </div>
  </div>
</body>
</html>
