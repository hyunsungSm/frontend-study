<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .profile{
      width: 100px;
      height: 100px;
      margin: auto;
      background-color: white;
      background-image: url(/05_CSS/images/img_avatar.png);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100px;
      border-radius: 100px;
    }
    
    .title{
      text-align: center;
      font-size: 30px;
      font-family: sans-serif;
    }

    .content{
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      font-family: sans-serif;
    }

    .content span{
      color: red;
    }

    .box{
      width: 500px;
      margin: auto;
      background-color: blue;
      border-radius: 10px;
      color: white;
      text-align: center;
      padding: 20px 0;
      box-shadow: 10px 10px black;
    }
  </style>
</head>
<body>
  <!-- 주어진 구조 외에 추가 가능 -->
  <!-- div.profile>img -->
<div class="profile"></div>
  <!-- h3.title -->
<div>
  <h3 class="title">hyunseong</h3>
</div>
  <!-- p.content -->
<div>
  <p class="content"><span>Full Stack</span> Developer</p>
</div>

  <!-- div.box -->
<div class="box">
  안녕하세요. hyunseong 입니다. <br>
  현재 구디 수강중이며 <br>
  취미는 운동입니다.
</div>


</body>
</html>
